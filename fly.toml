app = "glowing-meadowbrook-286"
primary_region = "sin"
# 256MB machine: a big upload next to Ghostscript got node OOM-killed (2026-10-27).
# Swap on the machine's own disk rides out such spikes instead of restarting.
swap_size_mb = 512

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3001"
  HOST = "0.0.0.0"

[http_service]
  internal_port = 3001
  force_https = true
  processes = ["app"]

[processes]
  app = "node server/server.cjs"
